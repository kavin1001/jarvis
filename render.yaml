# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Creates the backend web service and a Postgres database. Secrets marked
# sync: false are prompted for at creation time.
services:
  - type: web
    name: jarvis-backend
    runtime: docker
    # Built from the repo root so the image also contains the web app.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JARVIS_APP_TOKEN
        generateValue: true
      - key: FAST_MODEL
        value: claude-opus-5-5
      - key: FAST_EFFORT
        value: low
      - key: DAILY_BUDGET_USD
        value: "5"
      - key: TASK_AGENT_ID
        sync: false
      - key: TASK_ENVIRONMENT_ID
        sync: false
      - key: TASK_VAULT_ID
        sync: false
      # Optional Google connector; see docs/DEPLOY.md.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CONNECTOR_SECRET
        generateValue: true

databases:
  - name: jarvis-db
    plan: basic-256mb
